<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tennis Scoreboard - Wimbledon Style</title>
  <style>
    :root {
      --bg-color: #0c1911;
      --card-bg: #14281d;
      --team-a-color: #702963;
      --team-b-color: #006633;
      --team-a-court: #3b1935;
      --team-b-court: #0b3d22;
      --line-color: #ffffff;
      --accent-yellow: #ccff00;
      --text-main: #ffffff;
      --wimbledon-gold: #e2b041;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
    }

    #fs-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    #fs-overlay h2 {
      color: var(--accent-yellow);
      font-size: 1.6rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    #fs-overlay p {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-fullscreen-start {
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: var(--accent-yellow);
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(204, 255, 0, 0.3);
    }

    header {
      background-color: var(--card-bg);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #234733;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      background: #1c3829;
      border: 1px solid #2e5941;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:active {
      background: #2e5941;
    }

    .scoreboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    .team-card {
      flex: 1;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .team-a { background: linear-gradient(135deg, var(--team-a-color), #401438); }
    .team-b { background: linear-gradient(135deg, var(--team-b-color), #003319); }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-info { display: flex; align-items: center; gap: 8px; }
    .team-name { font-size: 1rem; font-weight: 800; }
    .player-names { font-size: 0.75rem; opacity: 0.85; }

    .sets-won {
      font-size: 1.4rem; font-weight: 900;
      background: rgba(0,0,0,0.35);
      padding: 2px 10px; border-radius: 6px;
    }

    .score-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .games-score { font-size: 2.2rem; font-weight: 800; opacity: 0.9; }
    .point-score { font-size: 3.2rem; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

    .serve-ball {
      display: inline-block;
      width: 10px; height: 10px;
      background-color: var(--accent-yellow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-yellow);
      visibility: hidden;
    }
    .serve-ball.active { visibility: visible; }

    .btn-score-up {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr 1fr;
      gap: 5px;
      padding: 0 8px 6px 8px;
    }

    .btn-action {
      background-color: #1c3829; color: white;
      border: 1px solid #2e5941;
      padding: 8px 0; border-radius: 6px;
      font-size: 0.75rem; font-weight: bold;
      cursor: pointer; text-align: center;
    }

    .btn-action.highlight {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .court-container {
      flex: 1.2;
      margin: 0 8px 8px 8px;
      background-color: #112217;
      border-radius: 10px;
      padding: 10px;
      position: relative;
      display: flex;
    }

    .court-inner {
      flex: 1;
      border: 2px solid var(--line-color);
      position: relative;
      display: flex;
      overflow: hidden;
    }

    .court-side {
      position: absolute;
      top: 0; bottom: 0; width: 50%;
      transition: background-color 0.3s ease;
    }
    .court-side.left { left: 0; }
    .court-side.right { right: 0; }

    .bg-team-a { background-color: var(--team-a-court); }
    .bg-team-b { background-color: var(--team-b-court); }

    .net-line {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 4px;
      background-color: var(--line-color);
      transform: translateX(-50%);
      z-index: 3;
    }

    .singles-line-top {
      position: absolute; top: 15%; left: 0; right: 0;
      height: 2px; background-color: var(--line-color); z-index: 2;
    }
    .singles-line-bottom {
      position: absolute; bottom: 15%; left: 0; right: 0;
      height: 2px; background-color: var(--line-color); z-index: 2;
    }

    .service-line-left {
      position: absolute; left: 25%; top: 15%; bottom: 15%;
      width: 2px; background-color: var(--line-color); z-index: 2;
    }
    .service-line-right {
      position: absolute; right: 25%; top: 15%; bottom: 15%;
      width: 2px; background-color: var(--line-color); z-index: 2;
    }

    .center-service-line {
      position: absolute; top: 50%; left: 25%; right: 25%;
      height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }

    .hash-left {
      position: absolute; left: 0; top: 50%;
      width: 8px; height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }
    .hash-right {
      position: absolute; right: 0; top: 50%;
      width: 8px; height: 2px; background-color: var(--line-color);
      transform: translateY(-50%); z-index: 2;
    }

    .side-label {
      position: absolute; font-size: 0.65rem; font-weight: bold;
      color: rgba(255,255,255,0.85); pointer-events: none; z-index: 4;
    }
    .side-label.left { left: 4px; top: 4px; }
    .side-label.right { right: 4px; top: 4px; }

    .target-service-box {
      position: absolute;
      width: 25%; height: 35%;
      background: rgba(204, 255, 0, 0.35);
      border: 2px dashed var(--accent-yellow);
      z-index: 4; pointer-events: none;
      transition: all 0.3s ease;
    }

    .player-marker {
      position: absolute;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      z-index: 5;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 90px;
    }

    .player-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .role-badge {
      font-size: 0.5rem;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      margin-top: 2px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: none;
    }

    .role-badge.visible {
      display: inline-block;
    }

    .player-marker.server {
      background-color: var(--accent-yellow) !important;
      color: #000 !important;
      border: 2px solid #000;
      transform: translate(-50%, -50%) scale(1.1);
      z-index: 10;
      box-shadow: 0 0 12px var(--accent-yellow);
    }

    .player-marker.server .role-badge {
      background: #000;
      color: var(--accent-yellow);
    }

    .player-marker.receiver {
      border: 2px solid var(--accent-yellow);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .player-marker.receiver .role-badge {
      background: var(--accent-yellow);
      color: #000;
    }

    .modal {
      display: none; position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 20; padding: 20px; overflow-y: auto;
    }

    .modal-content {
      background: var(--card-bg); border-radius: 12px;
      padding: 20px; max-width: 400px; margin: 10px auto;
      border: 1px solid #2e5941;
    }

    .modal h2 { color: var(--accent-yellow); font-size: 1.1rem; margin-bottom: 12px; }
    .setting-group { margin-bottom: 12px; }
    .setting-group label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
    .setting-group select, .setting-group input {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #2e5941; background: #0c1911; color: white; font-size: 0.85rem;
    }
    .input-row { display: flex; gap: 6px; margin-top: 4px; }

    .btn-save {
      width: 100%; padding: 10px; background: var(--accent-yellow);
      border: none; border-radius: 6px; font-weight: bold; color: #000;
      cursor: pointer; margin-top: 10px; font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div id="fs-overlay">
    <h2>WIMBLEDON SCOREBOARD</h2>
    <p>공식 윔블던 음성안내 및 최적화된 화면 구성을 위해<br>아래 버튼을 눌러 전체화면으로 시작하세요.</p>
    <button class="btn-fullscreen-start" onclick="startFullscreenApp()">전체화면으로 시작하기</button>
  </div>

  <header>
    <h1>TENNIS SCOREBOARD</h1>
    <div class="header-btns">
      <button class="btn-icon" id="btn-fullscreen-toggle" onclick="toggleFullscreen()">Full Screen</button>
      <button class="btn-icon" id="btn-settings">Settings</button>
    </div>
  </header>

  <div class="scoreboard">
    <div class="team-card team-a" id="card-team-a">
      <div class="team-header">
        <div class="team-info">
          <span class="serve-ball" id="serve-a"></span>
          <div>
            <div class="team-name">Team A</div>
            <div class="player-names" id="disp-players-a">Player A1 / A2</div>
          </div>
        </div>
        <span class="sets-won" id="sets-a">0</span>
      </div>
      <div class="score-body">
        <div class="games-score" id="games-a">0</div>
        <div class="point-score" id="points-a">0</div>
      </div>
      <button class="btn-score-up" onclick="addPoint('A')"></button>
    </div>

    <div class="team-card team-b" id="card-team-b">
      <div class="team-header">
        <div class="team-info">
          <span class="serve-ball" id="serve-b"></span>
          <div>
            <div class="team-name">Team B</div>
            <div class="player-names" id="disp-players-b">Player B1 / B2</div>
          </div>
        </div>
        <span class="sets-won" id="sets-b">0</span>
      </div>
      <div class="score-body">
        <div class="games-score" id="games-b">0</div>
        <div class="point-score" id="points-b">0</div>
      </div>
      <button class="btn-score-up" onclick="addPoint('B')"></button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-action" onclick="undo()">UNDO</button>
    <button class="btn-action highlight" id="btn-toggle-serve" onclick="toggleServeTeam()">SERVE: TEAM A</button>
    <button class="btn-action" onclick="manualCourtChange()">CHANGE COURT</button>
    <button class="btn-action" onclick="resetMatch()">RESET</button>
  </div>

  <div class="court-container">
    <div class="court-inner">
      <div class="court-side left" id="side-left-bg"></div>
      <div class="court-side right" id="side-right-bg"></div>

      <div class="net-line"></div>
      <div class="singles-line-top"></div>
      <div class="singles-line-bottom"></div>
      <div class="service-line-left"></div>
      <div class="service-line-right"></div>
      <div class="center-service-line"></div>
      <div class="hash-left"></div>
      <div class="hash-right"></div>

      <span class="side-label left" id="label-left">TEAM A</span>
      <span class="side-label right" id="label-right">TEAM B</span>

      <div class="target-service-box" id="target-box"></div>

      <div class="player-marker" id="pm-a1"></div>
      <div class="player-marker" id="pm-a2"></div>
      <div class="player-marker" id="pm-b1"></div>
      <div class="player-marker" id="pm-b2"></div>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h2>Match Settings</h2>
      
      <div class="setting-group">
        <label>Match Type</label>
        <select id="set-type" onchange="togglePlayerInputs()">
          <option value="doubles" selected>Doubles</option>
          <option value="singles">Singles</option>
        </select>
      </div>

      <div class="setting-group">
        <label>First Serve Team</label>
        <select id="set-first-serve">
          <option value="A" selected>Team A</option>
          <option value="B">Team B</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Sets to Win</label>
        <select id="set-sets">
          <option value="1">1 Set (Single Set)</option>
          <option value="2">Best of 3 (2 Sets)</option>
          <option value="3" selected>Best of 5 (3 Sets)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Games per Set</label>
        <select id="set-games">
          <option value="3">3 Games</option>
          <option value="5">5 Games</option>
          <option value="6" selected>6 Games</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Deuce Rule</label>
        <select id="set-deuce">
          <option value="no-ad">No-Ad (Sudden Death)</option>
          <option value="ad" selected>Advantage (Standard Wimbledon)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Court Change</label>
        <select id="set-court">
          <option value="manual" selected>Manual</option>
          <option value="auto">Auto (Odd Games)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Team A Players</label>
        <div class="input-row">
          <input type="text" id="p-a1" value="A. Murray" placeholder="Player 1 (Deuce Court)" />
          <input type="text" id="p-a2" value="J. Peers" placeholder="Player 2 (Ad Court)" />
        </div>
      </div>

      <div class="setting-group">
        <label>Team B Players</label>
        <div class="input-row">
          <input type="text" id="p-b1" value="R. Nadal" placeholder="Player 1 (Deuce Court)" />
          <input type="text" id="p-b2" value="M. Lopez" placeholder="Player 2 (Ad Court)" />
        </div>
      </div>

      <button class="btn-save" id="btn-save-settings">Apply & Reset Match</button>
    </div>
  </div>

  <script>
    let config = {
      type: 'doubles',
      firstServeTeam: 'A',
      setsToWin: 3,
      gamesPerSet: 6,
      deuceRule: 'ad',
      courtChange: 'manual',
      playersA: ['A. Murray', 'J. Peers'],
      playersB: ['R. Nadal', 'M. Lopez']
    };

    let state = {
      ptsA: 0, ptsB: 0,
      gamesA: 0, gamesB: 0,
      setsA: 0, setsB: 0,
      isTiebreak: false,
      currentServerTeam: 'A',
      serverIdxA: 0,
      serverIdxB: 0,
      courtLeftTeam: 'A'
    };

    let historyStack = [];
    const MAX_HISTORY = 10;
    const pointTerms = ["Love", "Fifteen", "Thirty", "Forty"];

    let wakeLock = null;
    let audioCtx = null;

    function loadStorage() {
      const savedConfig = localStorage.getItem('tennis_config');
      if (savedConfig) {
        try { config = JSON.parse(savedConfig); } catch(e) {}
      }
      const savedState = localStorage.getItem('tennis_state');
      if (savedState) {
        try { state = JSON.parse(savedState); } catch(e) {}
      }
    }

    function saveConfigToStorage() {
      localStorage.setItem('tennis_config', JSON.stringify(config));
    }

    function saveStateToStorage() {
      localStorage.setItem('tennis_state', JSON.stringify(state));
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function startFullscreenApp() {
      toggleFullscreen();
      requestWakeLock();
      document.getElementById('fs-overlay').style.display = 'none';
      render();
    }

    window.onload = () => {
      loadStorage();
      setupEvents();
      populateSettingsModal();
      render();
    };

    function setupEvents() {
      document.getElementById('btn-settings').onclick = () => {
        populateSettingsModal();
        document.getElementById('settings-modal').style.display = 'block';
      };
      document.getElementById('btn-save-settings').onclick = () => {
        saveSettings();
        document.getElementById('settings-modal').style.display = 'none';
      };
    }

    function populateSettingsModal() {
      document.getElementById('set-type').value = config.type;
      document.getElementById('set-first-serve').value = config.firstServeTeam;
      document.getElementById('set-sets').value = config.setsToWin;
      document.getElementById('set-games').value = config.gamesPerSet;
      document.getElementById('set-deuce').value = config.deuceRule;
      document.getElementById('set-court').value = config.courtChange;
      document.getElementById('p-a1').value = config.playersA[0] || '';
      document.getElementById('p-a2').value = config.playersA[1] || '';
      document.getElementById('p-b1').value = config.playersB[0] || '';
      document.getElementById('p-b2').value = config.playersB[1] || '';
      togglePlayerInputs();
    }

    function togglePlayerInputs() {
      const isSingles = document.getElementById('set-type').value === 'singles';
      document.getElementById('p-a2').style.display = isSingles ? 'none' : 'block';
      document.getElementById('p-b2').style.display = isSingles ? 'none' : 'block';
    }

    function saveSettings() {
      config.type = document.getElementById('set-type').value;
      config.firstServeTeam = document.getElementById('set-first-serve').value;
      config.setsToWin = parseInt(document.getElementById('set-sets').value, 10);
      config.gamesPerSet = parseInt(document.getElementById('set-games').value, 10);
      config.deuceRule = document.getElementById('set-deuce').value;
      config.courtChange = document.getElementById('set-court').value;
      
      config.playersA = [
        document.getElementById('p-a1').value || 'A1',
        document.getElementById('p-a2').value || 'A2'
      ];
      config.playersB = [
        document.getElementById('p-b1').value || 'B1',
        document.getElementById('p-b2').value || 'B2'
      ];

      saveConfigToStorage();
      resetMatch();
    }

    function saveState() {
      historyStack.push(JSON.parse(JSON.stringify(state)));
      if (historyStack.length > MAX_HISTORY) historyStack.shift();
    }

    function undo() {
      if (historyStack.length === 0) return;
      state = historyStack.pop();
      saveStateToStorage();
      render();
      speak("Undo");
    }

    function resetMatch() {
      state = {
        ptsA: 0, ptsB: 0,
        gamesA: 0, gamesB: 0,
        setsA: 0, setsB: 0,
        isTiebreak: false,
        currentServerTeam: config.firstServeTeam,
        serverIdxA: 0, serverIdxB: 0,
        courtLeftTeam: 'A'
      };
      historyStack = [];
      saveStateToStorage();
      render();
      speak("Reset");
    }

    function toggleServeTeam() {
      saveState();
      state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
      saveStateToStorage();
      render();
      speak(`Service Team ${state.currentServerTeam}`);
    }

    function addPoint(team) {
      saveState();
      if (state.isTiebreak) {
        handleTiebreakPoint(team);
      } else {
        handleStandardPoint(team);
      }
      saveStateToStorage();
      render();
    }

    function handleStandardPoint(team) {
      const isA = (team === 'A');
      let pWin = isA ? state.ptsA : state.ptsB;
      let pLose = isA ? state.ptsB : state.ptsA;

      if (config.deuceRule === 'no-ad' && pWin === 3 && pLose === 3) {
        winGame(team);
        return;
      }

      if (pWin >= 3 && pLose >= 3) {
        if (pWin === pLose) {
          if (isA) state.ptsA++; else state.ptsB++;
          speakCall();
        } else if ((isA && state.ptsA > state.ptsB) || (!isA && state.ptsB > state.ptsA)) {
          winGame(team);
        } else {
          state.ptsA = 3; state.ptsB = 3;
          speakCall();
        }
      } else if (pWin === 3) {
        winGame(team);
      } else {
        if (isA) state.ptsA++; else state.ptsB++;
        speakCall();
      }
    }

    function handleTiebreakPoint(team) {
      if (team === 'A') state.ptsA++; else state.ptsB++;
      const totalPts = state.ptsA + state.ptsB;

      if (totalPts % 2 === 1) switchServer();
      if (config.courtChange === 'auto' && totalPts % 6 === 0) manualCourtChange(false);

      if ((state.ptsA >= 7 || state.ptsB >= 7) && Math.abs(state.ptsA - state.ptsB) >= 2) {
        winGame(state.ptsA > state.ptsB ? 'A' : 'B');
      } else {
        speakCall();
      }
    }

    function getLastName(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(' ');
      return parts[parts.length - 1];
    }

    function getTeamDisplayName(team) {
      if (config.type === 'singles') {
        const player = team === 'A' ? config.playersA[0] : config.playersB[0];
        return getLastName(player);
      } else {
        return `Team ${team}`;
      }
    }

    function winGame(team) {
      const winnerCall = getTeamDisplayName(team);
      speak(`Game ${winnerCall}`);
      
      if (team === 'A') state.gamesA++; else state.gamesB++;
      state.ptsA = 0; state.ptsB = 0;

      const totalGames = state.gamesA + state.gamesB;
      if (config.courtChange === 'auto' && totalGames % 2 === 1 && !state.isTiebreak) {
        manualCourtChange(false);
      }

      const gWin = team === 'A' ? state.gamesA : state.gamesB;
      const gLose = team === 'A' ? state.gamesB : state.gamesA;

      if (state.isTiebreak) {
        winSet(team);
      } else if (gWin >= config.gamesPerSet && (gWin - gLose) >= 2) {
        winSet(team);
      } else if (gWin === config.gamesPerSet && gLose === config.gamesPerSet) {
        state.isTiebreak = true;
        speak("Tiebreak");
        switchServer();
      } else {
        switchServer();
      }
    }

    function winSet(team) {
      const winnerCall = getTeamDisplayName(team);
      if (team === 'A') state.setsA++; else state.setsB++;

      state.gamesA = 0; state.gamesB = 0;
      state.isTiebreak = false;

      const sWin = team === 'A' ? state.setsA : state.setsB;
      if (sWin >= config.setsToWin) {
        speak(`Game, set and match, ${winnerCall}`);
      } else {
        speak(`Set, ${winnerCall}`);
        switchServer();
      }
    }

    /* 
      수정된 서브 교체 로직 (팀1 P1 -> 팀2 P1 -> 팀1 P2 -> 팀2 P2)
    */
    function switchServer() {
      if (config.type === 'singles') {
        state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
      } else {
        // 복식 게임 순환: (A0) -> (B0) -> (A1) -> (B1) -> 다시 (A0)
        if (state.currentServerTeam === 'A') {
          state.currentServerTeam = 'B';
        } else {
          state.currentServerTeam = 'A';
          state.serverIdxA = (state.serverIdxA + 1) % 2;
          state.serverIdxB = (state.serverIdxB + 1) % 2;
        }
      }
    }

    function manualCourtChange(announce = true) {
      saveState();
      state.courtLeftTeam = (state.courtLeftTeam === 'A') ? 'B' : 'A';
      saveStateToStorage();
      render();
      if (announce) speak("Change ends");
    }

    function playWakeUpSound() {
      return new Promise((resolve) => {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);

          setTimeout(resolve, 250);
        } catch (e) {
          console.error("AudioContext Wakeup Error:", e);
          resolve();
        }
      });
    }

    async function speak(text) {
      await playWakeUpSound();

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-GB';
          utterance.rate = 0.92;
          utterance.pitch = 0.95;
          
          const voices = window.speechSynthesis.getVoices();
          const gbVoice = voices.find(v => v.lang === 'en-GB' || v.lang.includes('en_GB'));
          if (gbVoice) utterance.voice = gbVoice;

          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.error("Web Speech API Error:", e);
        }
      }
    }

    function speakCall() {
      if (state.isTiebreak) {
        speak(`${state.ptsA}-${state.ptsB}`);
        return;
      }

      const pA = state.ptsA;
      const pB = state.ptsB;

      if (pA >= 3 && pB >= 3) {
        if (pA === pB) {
          speak("Deuce");
        } else if (pA > pB) {
          const name = config.type === 'singles' ? getLastName(config.playersA[0]) : "Team A";
          speak(`Advantage ${name}`);
        } else {
          const name = config.type === 'singles' ? getLastName(config.playersB[0]) : "Team B";
          speak(`Advantage ${name}`);
        }
      } else {
        if (pA === pB) {
          if (pointTerms[pA] === "Love") speak("Love All");
          else speak(`${pointTerms[pA]}-All`);
        } else {
          const sPts = state.currentServerTeam === 'A' ? pA : pB;
          const rPts = state.currentServerTeam === 'A' ? pB : pA;
          speak(`${pointTerms[sPts]}-${pointTerms[rPts]}`);
        }
      }
    }

    function formatScore(pts, oppPts) {
      if (state.isTiebreak) return pts.toString();
      if (pts >= 3 && oppPts >= 3) {
        if (pts === oppPts) return "40";
        return pts > oppPts ? "AD" : "40";
      }
      return pointTerms[pts] ? (pointTerms[pts] === "Love" ? "0" : (pts === 1 ? "15" : pts === 2 ? "30" : "40")) : "0";
    }

    function render() {
      document.getElementById('disp-players-a').innerText = config.type === 'doubles' 
        ? `${config.playersA[0]} / ${config.playersA[1]}` : config.playersA[0];
      document.getElementById('disp-players-b').innerText = config.type === 'doubles' 
        ? `${config.playersB[0]} / ${config.playersB[1]}` : config.playersB[0];

      document.getElementById('sets-a').innerText = state.setsA;
      document.getElementById('sets-b').innerText = state.setsB;
      document.getElementById('games-a').innerText = state.gamesA;
      document.getElementById('games-b').innerText = state.gamesB;

      document.getElementById('points-a').innerText = formatScore(state.ptsA, state.ptsB);
      document.getElementById('points-b').innerText = formatScore(state.ptsB, state.ptsA);

      document.getElementById('serve-a').classList.toggle('active', state.currentServerTeam === 'A');
      document.getElementById('serve-b').classList.toggle('active', state.currentServerTeam === 'B');

      document.getElementById('btn-toggle-serve').innerText = `SERVE: TEAM ${state.currentServerTeam}`;

      const leftTeam = state.courtLeftTeam;
      const rightTeam = (leftTeam === 'A') ? 'B' : 'A';

      document.getElementById('side-left-bg').className = `court-side left ${leftTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;
      document.getElementById('side-right-bg').className = `court-side right ${rightTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;

      document.getElementById('label-left').innerText = `TEAM ${leftTeam}`;
      document.getElementById('label-right').innerText = `TEAM ${rightTeam}`;

      const totalPts = state.ptsA + state.ptsB;
      const isDeuceServe = (totalPts % 2 === 0);
      const isDoubles = (config.type === 'doubles');

      const serverTeam = state.currentServerTeam;
      const activeServerIdx = isDoubles ? (serverTeam === 'A' ? state.serverIdxA : state.serverIdxB) : 0;

      const pmA1 = document.getElementById('pm-a1');
      const pmA2 = document.getElementById('pm-a2');
      const pmB1 = document.getElementById('pm-b1');
      const pmB2 = document.getElementById('pm-b2');

      const updateMarkerContent = (el, name, role) => {
        let badgeHtml = '';
        if (role === 'SERVE') {
          badgeHtml = `<span class="role-badge visible">SERVE</span>`;
        } else if (role === 'RECEIVE') {
          badgeHtml = `<span class="role-badge visible">RECEIVER</span>`;
        } else {
          badgeHtml = `<span class="role-badge"></span>`;
        }
        el.innerHTML = `<span class="player-name-text">${name}</span>${badgeHtml}`;
      };

      const isA1_Server = (serverTeam === 'A' && activeServerIdx === 0);
      const isA2_Server = (serverTeam === 'A' && activeServerIdx === 1);
      const isB1_Server = (serverTeam === 'B' && activeServerIdx === 0);
      const isB2_Server = (serverTeam === 'B' && activeServerIdx === 1);

      const isA1_Receiver = (serverTeam === 'B' && isDeuceServe);
      const isA2_Receiver = (serverTeam === 'B' && !isDeuceServe);
      const isB1_Receiver = (serverTeam === 'A' && isDeuceServe);
      const isB2_Receiver = (serverTeam === 'A' && !isDeuceServe);

      updateMarkerContent(pmA1, config.playersA[0], isA1_Server ? 'SERVE' : (isA1_Receiver ? 'RECEIVE' : ''));
      updateMarkerContent(pmA2, config.playersA[1], isA2_Server ? 'SERVE' : (isA2_Receiver ? 'RECEIVE' : ''));
      updateMarkerContent(pmB1, config.playersB[0], isB1_Server ? 'SERVE' : (isB1_Receiver ? 'RECEIVE' : ''));
      updateMarkerContent(pmB2, config.playersB[1], isB2_Server ? 'SERVE' : (isB2_Receiver ? 'RECEIVE' : ''));

      pmA1.style.background = 'var(--team-a-color)';
      pmA2.style.background = 'var(--team-a-color)';
      pmB1.style.background = 'var(--team-b-color)';
      pmB2.style.background = 'var(--team-b-color)';

      pmA2.style.display = isDoubles ? 'flex' : 'none';
      pmB2.style.display = isDoubles ? 'flex' : 'none';

      document.querySelectorAll('.player-marker').forEach(m => {
        m.classList.remove('server', 'receiver');
      });

      if (serverTeam === 'A') {
        if (activeServerIdx === 0) pmA1.classList.add('server'); else pmA2.classList.add('server');
        if (isDeuceServe) pmB1.classList.add('receiver'); else pmB2.classList.add('receiver');
      } else {
        if (activeServerIdx === 0) pmB1.classList.add('server'); else pmB2.classList.add('server');
        if (isDeuceServe) pmA1.classList.add('receiver'); else pmA2.classList.add('receiver');
      }

      const setPos = (el, x, y) => {
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
      };

      const targetBox = document.getElementById('target-box');

      const placeTeamPlayers = (team, isLeft) => {
        const p1 = (team === 'A') ? pmA1 : pmB1;
        const p2 = (team === 'A') ? pmA2 : pmB2;
        const isServerTeam = (serverTeam === team);

        if (isLeft) {
          if (isServerTeam) {
            if (isDeuceServe) {
              if (activeServerIdx === 0) {
                setPos(p1, 10, 70);
                if (isDoubles) setPos(p2, 38, 30);
              } else {
                setPos(p2, 10, 70);
                if (isDoubles) setPos(p1, 38, 30);
              }
            } else {
              if (activeServerIdx === 0) {
                setPos(p1, 10, 30);
                if (isDoubles) setPos(p2, 38, 70);
              } else {
                setPos(p2, 10, 30);
                if (isDoubles) setPos(p1, 38, 70);
              }
            }
          } else {
            setPos(p1, 16, 70);
            if (isDoubles) setPos(p2, 16, 30);
          }
        } else {
          if (isServerTeam) {
            if (isDeuceServe) {
              if (activeServerIdx === 0) {
                setPos(p1, 90, 30);
                if (isDoubles) setPos(p2, 62, 70);
              } else {
                setPos(p2, 90, 30);
                if (isDoubles) setPos(p1, 62, 70);
              }
            } else {
              if (activeServerIdx === 0) {
                setPos(p1, 90, 70);
                if (isDoubles) setPos(p2, 62, 30);
              } else {
                setPos(p2, 90, 70);
                if (isDoubles) setPos(p1, 62, 30);
              }
            }
          } else {
            setPos(p1, 84, 30);
            if (isDoubles) setPos(p2, 84, 70);
          }
        }
      };

      placeTeamPlayers(leftTeam, true);
      placeTeamPlayers(rightTeam, false);

      const serverOnLeft = (serverTeam === leftTeam);
      if (serverOnLeft) {
        if (isDeuceServe) {
          setPos(targetBox, 50, 15);
        } else {
          setPos(targetBox, 50, 50);
        }
      } else {
        if (isDeuceServe) {
          setPos(targetBox, 25, 50);
        } else {
          setPos(targetBox, 25, 15);
        }
      }
    }
  </script>
